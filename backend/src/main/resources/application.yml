# 로컬 .env 값을 IntelliJ 실행 설정의 환경변수로 전달해 사용합니다.
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:kmanual_dev}
    username: ${MYSQL_USER:kmanual_app}
    password: ${MYSQL_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
